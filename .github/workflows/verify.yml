name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build (kernel-checks every proof)
        working-directory: lean
        run: lake build
      - name: Axiom audit
        run: python3 scripts/check_axioms.py
      - name: Forbidden constructs
        run: python3 scripts/check_forbidden.py
      - name: Construction data matches the Lean sources
        run: |
          python3 scripts/extract_lean_data.py
          git diff --exit-code -- results/
      - name: Independent checker (small graphs without power-of-two cycles)
        run: python3 results/small-graphs-power-of-two-cycles/verify.py
      - name: Independent checks (cubic bipartite graphs)
        run: python3 results/cubic-bipartite-power-of-two-cycles/independent_check.py
      - name: Search and witness checkers at small caps (cubic bipartite graphs)
        run: python3 results/cubic-bipartite-power-of-two-cycles/reproduce.py --quick
      - name: Census checker rejects corrupted results (cubic censuses)
        run: python3 results/cubic-census-power-of-two-cycles/test_checker.py
      - name: Encoding tests (Tutte-Coxeter lifts)
        run: python3 results/tutte-coxeter-lifts-without-32-cycles/test_encoding.py
      - name: Case A and both controls with DRAT check (Tutte-Coxeter lifts)
        run: python3 results/tutte-coxeter-lifts-without-32-cycles/prove.py --workers 3 --only delta3_a14 control_delta3_a15 control_cubic_a20
      - name: Census scanner smoke test on the (3,10)-cages (cubic censuses)
        run: |
          g++ -O3 -std=c++17 -pthread results/cubic-census-power-of-two-cycles/src/census_scan.cpp -o /tmp/census_scan
          awk '{print NR"\t"$0}' results/cubic-bipartite-power-of-two-cycles/data/cagesk3g10.g6 \
            | /tmp/census_scan --mode general --girth --workers 2 | tee /tmp/cages.tsv
          test "$(cut -f3,4 /tmp/cages.tsv | sort -u)" = "$(printf '10\t16')"
